# ULPF — Universal Log Pre-processing Framework
# Docker Compose — Production/Demo Configuration
#
# Single public entrypoint: http://localhost:8000
# All internal services are network-isolated.

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ulpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulpf}
      POSTGRES_DB: ${POSTGRES_DB:-ulpf}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulpf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ulpf-internal

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - ulpf-internal

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-StrongPassword123!}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - os-data:/usr/share/opensearch/data
    networks:
      - ulpf-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u admin:${OPENSEARCH_PASSWORD:-StrongPassword123!} http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ulpf-internal

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ulpf-internal

  # ─── ULPF Application (single public entrypoint) ──────────────────────────

  ulpf-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    environment:
      - ULPF_MODE=${ULPF_MODE:-dev}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ulpf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ulpf}
      - POSTGRES_DB=${POSTGRES_DB:-ulpf}
      - REDIS_URI=redis://redis:6379/0
      - OPENSEARCH_URI=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-StrongPassword123!}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - VAULT_DIR=/data/vault
      - ULPF_MOCK_LLM=${ULPF_MOCK_LLM:-false}
      - ULPF_MODEL_PATH=/models/qwen.gguf
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ulpf-admin}
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production-minimum-32-characters}
      - MASK_HMAC_KEY=${MASK_HMAC_KEY:-changeme-mask-key-minimum-32-chars}
    volumes:
      - vault-data:/data/vault
      - model-data:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      opensearch:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - ulpf-internal
    restart: unless-stopped

  # ─── ULPF Worker (Kafka Consumer / Horizontal Scaling) ─────────────────────

  ulpf-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["sh", "-c", "echo 'Starting Kafka Consumer (Worker)...' && python -m app.worker"]
    environment:
      - ULPF_MODE=${ULPF_MODE:-dev}
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ulpf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ulpf}
      - POSTGRES_DB=${POSTGRES_DB:-ulpf}
      - REDIS_URI=redis://redis:6379/0
      - OPENSEARCH_URI=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-StrongPassword123!}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    deploy:
      replicas: 3 # Scales the worker to 3 instances horizontally
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - ulpf-internal
    restart: unless-stopped

networks:
  ulpf-internal:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  os-data:
  vault-data:
  model-data:
